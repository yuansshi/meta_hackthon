# Fly.io: the Earshot server + web client from the repo-root Dockerfile. Secrets: META_API_KEY, FIREWORKS_API_KEY.
# One always-on machine: sessions, the budget and per-IP limits live in process memory, and judges
# must never hit a cold start.
app = "earshot-yuansshi"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  EARSHOT_DATA_DIR = "/tmp/earshot"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
